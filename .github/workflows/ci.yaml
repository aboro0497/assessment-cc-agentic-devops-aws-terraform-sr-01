name: CI Pipeline

on:
  push:
    branches:
      - main
      - devel
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - devel

defaults:
  run:
    working-directory: codebase/rdicidr-0.1.0

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'
          cache: 'npm'
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      - name: Install dependencies
        run: npm install

  lint:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'
          cache: 'npm'
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'
          cache: 'npm'
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        env:
          CI: true
        run: npm run test

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'
          cache: 'npm'
          cache-dependency-path: codebase/rdicidr-0.1.0/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
